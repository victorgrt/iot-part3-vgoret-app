apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-planet-visualizer
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planet-visualizer
  template:
    metadata:
      labels:
        app: planet-visualizer
    spec:
      containers:
        - name: web-app
          image: vgoret/planet-visualizer:v2
          ports:
            - containerPort: 8888
