apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          image: vgoret/webapp:v1
          ports:
            - containerPort: 8888
