<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space is cool</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
        <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Matrix Background -->
    <canvas id="matrix-canvas"></canvas>
    <div id="canvas-container"></div>
    <aside class="scene-panel" aria-label="Scene settings">
        <div class="scene-panel__heading">
            <div>
                <p class="scene-panel__eyebrow">CUSTOMIZE</p>
                <h1>Scene controls</h1>
            </div>
            <button class="scene-panel__toggle" type="button" aria-label="Hide scene controls" title="Hide scene controls">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                    <path d="m5 12 5-5 5 5" />
                </svg>
            </button>
        </div>
        <div class="scene-panel__content">
            <section class="scene-panel__section" aria-labelledby="appearance-heading">
                <h2 id="appearance-heading">Appearance</h2>
                <label class="scene-panel__color">
                    <span>Planet</span>
                    <input data-scene-control="planet-color" type="color" value="#1a4099">
                </label>
                <label class="scene-panel__color">
                    <span>Moons</span>
                    <input data-scene-control="moon-color" type="color" value="#991a40">
                </label>
                <label class="scene-panel__color">
                    <span>Hiragana star field</span>
                    <input data-scene-control="field-color" type="color" value="#75caff">
                </label>
                <label class="scene-panel__color">
                    <span>Shooting stars</span>
                    <input data-scene-control="shooting-star-color" type="color" value="#ffffff">
                </label>
            </section>

            <section class="scene-panel__section" aria-labelledby="lighting-heading">
                <h2 id="lighting-heading">Lighting</h2>
                <label class="scene-panel__range">
                    <span>Planet light <output data-scene-output="planet-light"></output></span>
                    <input data-scene-control="planet-light" type="range" min="0" max="2" step="0.05" value="0.6">
                </label>
                <label class="scene-panel__range">
                    <span>Moon lights <output data-scene-output="moon-light"></output></span>
                    <input data-scene-control="moon-light" type="range" min="0" max="2" step="0.05" value="0.5">
                </label>
            </section>

            <section class="scene-panel__section" aria-labelledby="motion-heading">
                <h2 id="motion-heading">Motion</h2>
                <label class="scene-panel__range">
                    <span>Number of moons <output data-scene-output="moon-count"></output></span>
                    <input data-scene-control="moon-count" type="range" min="0" max="12" step="1" value="3">
                </label>
                <label class="scene-panel__range">
                    <span>Movement speed <output data-scene-output="motion-speed"></output></span>
                    <input data-scene-control="motion-speed" type="range" min="0" max="3" step="0.05" value="1">
                </label>
            </section>
        </div>
    </aside>
    <button class="scene-panel-expand" type="button" aria-label="Show scene controls" title="Show scene controls" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 12 5-5 5 5" />
        </svg>
        <span>Scene controls</span>
    </button>
    <aside class="control-hint" aria-label="Scene controls">
        <div class="control-hint__item">
            <svg class="control-hint__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a7 7 0 0 0-7 7v4a7 7 0 0 0 14 0v-4a7 7 0 0 0-7-7Z" />
                <path d="M12 3v6m-3 0h6" />
            </svg>
            <span>Drag to rotate</span>
        </div>
        <span class="control-hint__divider" aria-hidden="true"></span>
        <div class="control-hint__item">
            <span class="control-hint__keys" aria-hidden="true">
                <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd>
            </span>
            <span>Rotate &amp; zoom</span>
        </div>
        <span class="control-hint__divider" aria-hidden="true"></span>
        <div class="control-hint__item">
            <kbd class="control-hint__space-key">Space</kbd>
            <span>Pause rotation</span>
        </div>
        <button class="control-hint__button" type="button" aria-label="Hide controls" title="Hide controls">
            <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="m5 8 5 5 5-5" />
            </svg>
        </button>
    </aside>
    <button class="control-hint-expand" type="button" aria-label="Show controls" title="Show controls" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="m5 12 5-5 5 5" />
        </svg>
        <span>Controls</span>
    </button>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
